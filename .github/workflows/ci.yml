name: qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: false
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_portability.py
      - run: python scripts/verify_distribution.py
      - run: python scripts/probe_claude_skill.py --no-claude
      - run: python scripts/benchmark_outputs.py --output dist/benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
